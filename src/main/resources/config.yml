settings:
  debug: false
  metrics: true
  update-check: true
  snap-to-grid: true # ставить табло по центру блока и поворачивать кратно 90°

command:
  main: rvb
  aliases: [ rvisualboards ]

# Клики по кнопкам табло
clicks:
  cooldown-millis: 300 # пауза между кликами одного игрока

# Увеличение кнопок и строк, на которые смотрит игрок
hover:
  buttons: true
  rows: true
  scale: 1.15
  row-scale: 1.1
  distance: 6.0
  duration-ticks: 3

# Листание мест сменой слота хотбара, пока игрок смотрит на строки
scroll:
  enabled: true
  max-places: 100 # до какого места листать
  step: 1
  distance: 8.0

# Анимация появления табло и смены топа
# types: SLIDE_LEFT, SLIDE_RIGHT, ZOOM, CASCADE
animation:
  enabled: true
  appear: true
  types: [ CASCADE ]
  duration-ticks: 6
  stagger-ticks: 1
  distance: 0.6

# Эффекты табло
effects:
  wave:
    enabled: true # при обновлении топа строки по очереди подпрыгивают
    height: 0.05 # на сколько блоков подпрыгивает строка
    stagger-ticks: 1 # задержка между соседними строками
    duration-ticks: 4

# Шаблоны плейсхолдеров ajLeaderboards. {board}, {place} и {type} подставляет плагин
placeholders:
  name: "%ajlb_lb_{board}_{place}_{type}_name%"
  prefix: "%ajlb_lb_{board}_{place}_{type}_prefix%"
  value: "%ajlb_lb_{board}_{place}_{type}_value%"
  position: "%ajlb_position_{board}_{type}%"
  personal-value: "%ajlb_value_{board}_{type}%"
  empty-name: "---"

# Ширина символов в пикселях, если плагин неверно выравнивает их в колонках
char-widths:
  "☠": 9
  "№": 9
  "—": 9
  "⛃": 9
  "⌚": 9
  "◀": 9
  "▶": 9
  "➜": 9
  "✝": 9
  "⛏": 9
  "⚔": 9
  "⚓": 9
  "⇧": 9

# Всё, что влияет на нагрузку. 20 тиков = 1 секунда
performance:
  update-interval-seconds: 10 # как часто обновлять топы из ajLeaderboards
  view-radius: 32.0 # с какого расстояния игрок видит табло, в блоках
  viewer-check-interval-ticks: 20 # как часто искать игроков рядом с табло
  hover-check-interval-ticks: 2 # как часто проверять, на что смотрит игрок

# Пустой key выключает звук. У топа может быть свой звук смены: tops.<топ>.switch-sound
sounds:
  click:
    key: "minecraft:ui.button.click"
    volume: 0.6
    pitch: 1.4
  hover:
    key: "minecraft:block.note_block.hat"
    volume: 0.3
    pitch: 1.8
  switch:
    key: "minecraft:item.book.page_turn"
    volume: 0.8
    pitch: 1.0

config-version: 3 #не трогать!!!
