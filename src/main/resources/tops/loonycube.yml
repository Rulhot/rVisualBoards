# Что делать по клику ЛКМ на строку топа: {name} ник из строки, {place} место, {player} кто кликнул, {top} ID топа.
# С console: в начале команда выполнится от консоли, иначе от игрока. Пустой список выключает клик.
# У топа может быть свой список: tops.balance.row-click
row-click: [] # например [ "profile {name}", "console:msg {player} {name} на {place} месте" ]

# Периоды топа: alltime, yearly, monthly, weekly, daily
periods:
  - alltime
period-names:
  alltime: "Всё время"
  yearly: "Год"
  monthly: "Месяц"
  weekly: "Неделя"
  daily: "День"
  hourly: "Час"

formats:
  subtitle: "<#8c8c8c>{period}"
  header-place: "<#a6a6a6>№"
  header-name: "<#a6a6a6>Игрок"
  header-value: "<#a6a6a6>Значение"
  row-place: "<white>{place}"
  row-name: "{prefix}<#f0f0f0>{name}"
  row-value: "<white>{value}"
  empty-place: "<white>{place}"
  empty-name: "<#f0f0f0>---"
  empty-value: "<white>---"
  personal-place: "<white>{position}"
  personal-place-unranked: "<white>-"
  personal-name: "<#f0f0f0>{name}"
  personal-value: "<white>{value}"
  button: "<white>{label}"
  button-selected: "<white>{label}"
  arrow-left: "<white>◀"
  arrow-right: "<white>▶"
  tab: "<gray>{period}"
  tab-selected: "<white>{period}"
  # Подсказка над хотбаром при наведении, пусто: без подсказки. В hint-row есть {name} и {place}
  hint-row: ""
  hint-button: ""

table:
  width: 5.5
  rows: 15
  text-scale: 1.0
  title-scale: 1.0
  personal-row: false
  shadow: true
  full-bright: true

buttons:
  enabled: true
  visible: 3
  arrows: true
  height: 0.3
  text-scale: 1.0
  arrow-width: 0.2
  side: BOTTOM # где кнопки и стрелки: BOTTOM под таблицей, LEFT или RIGHT столбиком сбоку
  side-width: 1.2 # ширина столбика, если side: LEFT или RIGHT

tabs:
  enabled: false
  height: 0.24
  text-scale: 0.8

# Колонки. from и to: границы колонки по ширине табло, align: LEFT, CENTER, RIGHT
columns:
  place:
    from: -2.75
    to: -2.21
    align: RIGHT
  name:
    from: -2.16
    to: 1.51
    align: CENTER
  value:
    from: 1.62
    to: 2.75
    align: RIGHT

# Цвета в формате #AARRGGBB, первые две цифры задают прозрачность
colors:
  title: "#70000000"
  header: "#80000000"
  column: "#5A000000"
  personal-row: "#5A000000"
  button: "#66000000"
  button-selected: "#B3402709"
  arrow: "#66000000"
  tab: "#40000000"
  tab-selected: "#99000000"

spacing:
  padding: 0.1
  title-height: 0.26
  subtitle-height: 0.0
  header-height: 0.31
  gap: 0.03
  cell-padding: 0.05
  buttons-margin: 0.24
  buttons-gap: 0.13
  depth-step: 0.01
