tops:
  balance:
    board: vault_eco_balance
    label: "Баланс"
    title: "<gradient:#f59e5b:#f5c05b>Топ по монетам"
    button-color: "#B3402709"
    # Свой звук при переключении на этот топ, вместо sounds.switch из config.yml
    # switch-sound:
    #   key: "minecraft:entity.experience_orb.pickup"
    #   volume: 0.6
    #   pitch: 1.2
    formats:
      header-value: "<#a6a6a6>Баланс"
      row-place: "<#f9ce5c>{place}"
      row-value: "<#ebb857>{value} <#f5a05b>⛃"
      empty-place: "<#f9ce5c>{place}"
      empty-value: "<#ebb857>--- <#f5a05b>⛃"
  time:
    board: statistic_hours_played
    label: "Время"
    title: "<gradient:#2774f3:#a9a3f5>Топ по времени"
    button-color: "#B3071A32"
    formats:
      header-value: "<#a6a6a6>Время"
      row-place: "<#126ef8>{place}"
      row-value: "<#1168eb>{value} <#fcfcfc>ч. <#126ef8>⌚"
      empty-place: "<#126ef8>{place}"
      empty-value: "<#1168eb>--- <#fcfcfc>ч. <#126ef8>⌚"
  kills:
    board: statistic_player_kills
    label: "Убийства"
    title: "<gradient:#f3306a:#f31e5a>Топ по убийствам"
    button-color: "#B3360C0C"
    formats:
      header-value: "<#a6a6a6>Убийства"
      row-place: "<#f74141>{place}"
      row-value: "<#ea3e3e>{value} <#f84141>☠"
      empty-place: "<#f74141>{place}"
      empty-value: "<#ea3e3e>--- <#f84141>☠"
